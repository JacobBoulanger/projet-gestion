<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commande - Projet de gestion</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #1f1f1f;
    }
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,.10);
    }
    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 30px;
    }
    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: #666;
      line-height: 1.4;
    }
    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }
    input, select {
      width: 100%;
      padding: 14px 13px;
      border: 1px solid #cfcfcf;
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
    }
    input:focus, select:focus {
      outline: 2px solid #222;
      outline-offset: 1px;
      border-color: #222;
    }
    .age-box {
      display: none;
      margin: 4px 0 18px;
      padding: 12px;
      border-radius: 10px;
      background: #fff7df;
      border: 1px solid #ead293;
    }
    .age-box.visible { display: block; }
    .age-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .age-row input {
      width: auto;
      margin-top: 3px;
    }
    .age-row label {
      margin: 0;
      font-weight: 600;
      line-height: 1.35;
    }
    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 11px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      background: #111;
      color: #fff;
    }
    button:hover { opacity: .9; }
    .note {
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
      color: #777;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <h1>Passer une commande</h1>
      <p class="subtitle">Remplis le formulaire et nous préparerons ta commande pour ta table.</p>

      <!-- REMPLACEZ VOTRE-ADRESSE@EMAIL.COM PAR L'ADRESSE QUI DOIT RECEVOIR LES COMMANDES -->
      <form action="https://formsubmit.co/soireeprojetgestion@gmail.com" method="POST" id="commandeForm">

        <!-- Réglages FormSubmit -->
        <input type="hidden" name="_subject" value="Nouvelle commande - Projet de gestion">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">

        <div class="field">
          <label for="prenom">Prénom</label>
          <input type="text" id="prenom" name="Prénom" required autocomplete="given-name">
        </div>

        <div class="field">
          <label for="nom">Nom</label>
          <input type="text" id="nom" name="Nom" required autocomplete="family-name">
        </div>

        <div class="field">
          <label for="produit">Produit désiré</label>
          <select id="produit" name="Produit désiré" required>
            <option value="">Sélectionner un produit</option>

            <optgroup label="Boissons sans alcool">
              <option value="Eau">Eau</option>
              <option value="Pepsi">Pepsi</option>
              <option value="Pepsi Diète">Pepsi Diète</option>
              <option value="7UP">7UP</option>
            </optgroup>

            <optgroup label="Boissons alcoolisées">
              <option value="Bière" data-alcool="true">Bière</option>
              <option value="Cooler" data-alcool="true">Cooler</option>
            </optgroup>

            <optgroup label="Nourriture / Snacks">
              <option value="Chips">Chips</option>
              <option value="Popcorn">Popcorn</option>
              <option value="Barre de chocolat">Barre de chocolat</option>
              <option value="Bonbons">Bonbons</option>
            </optgroup>
          </select>
        </div>

        <div class="age-box" id="ageBox">
          <div class="age-row">
            <input type="checkbox" id="age18" name="Confirmation 18+" value="Oui">
            <label for="age18">Je confirme avoir 18 ans ou plus. Une pièce d’identité peut être demandée lors de la remise d’une boisson alcoolisée.</label>
          </div>
        </div>

        <div class="field">
          <label for="table">Numéro de table</label>
          <input type="number" id="table" name="Numéro de table" min="1" step="1" inputmode="numeric" required>
        </div>

        <button type="submit">Envoyer ma commande</button>

        <p class="note">
          Les boissons alcoolisées sont réservées aux personnes de 18 ans ou plus.
        </p>
      </form>
    </div>
  </div>

  <script>
    const produit = document.getElementById("produit");
    const ageBox = document.getElementById("ageBox");
    const age18 = document.getElementById("age18");

    produit.addEventListener("change", function () {
      const selected = produit.options[produit.selectedIndex];
      const alcool = selected && selected.dataset.alcool === "true";

      ageBox.classList.toggle("visible", alcool);
      age18.required = alcool;

      if (!alcool) {
        age18.checked = false;
      }
    });
  </script>
</body>
</html>
